<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatTranslate Web</title>
    <script>
      (function () {
        var base = (window.location.pathname || '/').split('/').slice(0, 2).join('/') + '/';
        var target = base + '?p=' + encodeURIComponent(window.location.pathname + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
