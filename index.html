<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="ChatTranslate Web: translation platform for Minecraft communities."
    />
    <title>ChatTranslate</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pendingPath = params.get('p');

        // GitHub Pages sends unknown SPA routes to 404.html. Restore the
        // original callback URL before React and Supabase inspect it.
        if (!pendingPath) {
          return;
        }

        params.delete('p');
        var separator = pendingPath.indexOf('?') === -1 ? '?' : '&';
        var remainingQuery = params.toString();
        var restoredPath = pendingPath + (remainingQuery ? separator + remainingQuery : '');
        window.history.replaceState(null, '', restoredPath);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
